# Cipher Lab: static single-page app. No backend, so no proxy. Everything is noindex.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security and crawl headers. Set once here: an add_header inside a location would drop all of these,
  # so locations below use expires/try_files only.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location = /health { default_type text/plain; return 200 'ok'; }

  # Hashed build assets can be cached for a year.
  location /assets/ { expires 1y; try_files $uri =404; }

  # The three real routes get the app shell with status 200 and are never cached.
  location = / { expires -1; try_files /index.html =404; }
  location ~ ^/(math-lab|verify)/?$ { expires -1; try_files /index.html =404; }

  # Everything else must be a real file. Unknown URLs get a real 404 status, with the app shell as the body
  # so the app can show its own "not found" screen.
  location / { try_files $uri =404; }
  error_page 404 /index.html;
}
