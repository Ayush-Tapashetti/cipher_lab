# Development: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# Mounts the source and runs the Vite dev server with hot reload on http://localhost:5173.
services:
  frontend:
    build: !reset null
    image: node:24.20.0-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -w frontend -- --host"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports: !override
      - '127.0.0.1:${DEV_PORT:-5173}:5173'
    healthcheck:
      disable: true
volumes:
  node_modules:
